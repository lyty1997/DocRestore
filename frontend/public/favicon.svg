<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- DocRestore logo 图标：横条纹的「D」右侧实心、左缘碎裂成飞散蓝片，寓意文档「破损→还原」 -->
  <defs>
    <!-- D 字环形（外形减去内孔），作为横条纹的裁剪域 -->
    <clipPath id="d-ring">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M9 5h13c10.5 0 18 8 18 19s-7.5 19-18 19H9V5zm8 9v20h5c5.6 0 9.8-4.4 9.8-10S27.6 14 22 14h-5z"/>
    </clipPath>
  </defs>

  <!-- D 主体：横条纹（右侧深蓝、左半亮蓝），裁剪进 D 环形 -->
  <g clip-path="url(#d-ring)">
    <!-- 深蓝条纹（整条铺满，右侧主色） -->
    <g fill="#16233f">
      <rect x="6" y="5"  width="38" height="3.4"/>
      <rect x="6" y="11" width="38" height="3.4"/>
      <rect x="6" y="17" width="38" height="3.4"/>
      <rect x="6" y="23" width="38" height="3.4"/>
      <rect x="6" y="29" width="38" height="3.4"/>
      <rect x="6" y="35" width="38" height="3.4"/>
      <rect x="6" y="41" width="38" height="3.4"/>
    </g>
    <!-- 亮蓝条纹覆盖左半（碎裂侧主色） -->
    <g fill="#1ec8f0">
      <rect x="6" y="5"  width="13" height="3.4"/>
      <rect x="6" y="11" width="13" height="3.4"/>
      <rect x="6" y="17" width="13" height="3.4"/>
      <rect x="6" y="23" width="13" height="3.4"/>
      <rect x="6" y="29" width="13" height="3.4"/>
      <rect x="6" y="35" width="13" height="3.4"/>
      <rect x="6" y="41" width="13" height="3.4"/>
    </g>
  </g>

  <!-- 左缘飞散的蓝色碎片（文档还原意象） -->
  <g fill="#1ec8f0">
    <rect x="2.4" y="19" width="4.2" height="4.2" rx="0.6" transform="rotate(-18 4.5 21)"/>
    <rect x="1"   y="27" width="3.4" height="3.4" rx="0.6" transform="rotate(12 2.7 28.7)"/>
    <rect x="3.6" y="33" width="3"   height="3"   rx="0.5" transform="rotate(-24 5 34.5)"/>
    <rect x="4.2" y="12" width="2.6" height="2.6" rx="0.5" transform="rotate(20 5.5 13.3)"/>
    <rect x="0.6" y="15" width="2"   height="2"   rx="0.4" transform="rotate(-10 1.6 16)"/>
  </g>
</svg>
